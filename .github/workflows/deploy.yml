name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, test/modifying-file-before-deploying ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy and modify files
        run: |
          mkdir -p build
          cp -r ./sources/* build
          echo "Hello, World!" >> ./build/hello.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
